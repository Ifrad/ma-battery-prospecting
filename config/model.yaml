# Settings for the Phase 4 value model (make score). Values are simulated,
# gross per battery block before any host share, and unvalidated.

draws:
  value: 1000
  status: placeholder
  note: >-
    Monte Carlo draws per site. A computation setting, not a property of
    any building. Each building's draws are seeded by its building id and
    each site's by its site id, so results never depend on row order.
  test: >-
    Rerun with 4,000 draws and compare each site's P10, P50 and P90.
  replace: >-
    A draw count chosen from that comparison.

measured_kwh:
  # LBER match confidences that count as weak (see config/sites.yaml).
  weak_confidences: [low]
  weak_ambiguous: true
  status: placeholder
  note: >-
    A building with LBER measured electricity uses its reported yearly kWh
    as is; year-to-year variation is not modeled. When the match is weak
    (by address, or ambiguous between several buildings), the kWh may
    belong to more than one building, so it gets its segment's intensity
    spread around the reported value instead.
  test: >-
    Compare two LBER reporting years for the same buildings once the next
    release is loaded.
  replace: >-
    A width measured from year-to-year LBER changes.

area_error:
  # The 90th percentile absolute error of each area source.
  p90:
    assessor: 0.63
    assessor_below_footprint: 0.93
    assessor_above_footprint: 0.93
    footprint_x_stories: 0.93
    footprint_only: 0.71
  status: sourced
  source: >-
    docs/DATA.md, Footprint area error, "After site pooling and the area
    checks", measured 2026-10-19 on pilot candidates: the assessor source
    against LBER floor area (1,916 buildings, p90 63 percent), and
    footprint_x_stories (8,119 sites, 93) and footprint_only (9,284 sites,
    71) at site level against BLD_AREA.
  note: >-
    An estimated building's area is drawn as a lognormal around its stored
    area with sigma = ln(1 + p90 error) / 1.645, so about 90 percent of
    draws fall within the measured error. Sites flagged
    assessor_below_footprint or assessor_above_footprint use a footprint
    fallback, so they take the wider footprint_x_stories error. The error
    was measured only where BLD_AREA exists, so the real error on parcels
    missing it may be larger. Buildings with measured electricity get no
    area draw. No pilot site has an unknown utility; such a site would not
    be scored.

rate_band_kw:
  g2_below: 150
  g3_above: 250
  status: placeholder
  note: >-
    National Grid moves a customer from G-2 to G-3 at 200 kW (tariff), but
    the peak here is an estimate, so a site whose estimated peak is between
    these two values is weighted linearly between G-2 and G-3. Owner's
    band, 2026-10-20.
  test: >-
    Check the schedule on bills of sites with estimated peaks near 200 kW.
  replace: >-
    The site's actual rate schedule from its bill.

blocks:
  peak_kw_per_block: 1000
  max_blocks: null
  status: placeholder
  note: >-
    One battery block per this many kW of estimated peak, at least one,
    each block taking an equal share of the site's load. 1,000 kW is the
    lower edge of the top size bin in config/simulation.yaml, where one
    block cuts the most kW. Without the installed cost the count cannot be
    optimized, so this is a sizing rule, not an optimum. Revenue scales per
    block and installed cost is per block with no volume discount.
    max_blocks has no value: no cap is applied.
  test: >-
    Compare with the block counts the operator installs at large sites.
  replace: >-
    The operator's sizing rule and block cap.
