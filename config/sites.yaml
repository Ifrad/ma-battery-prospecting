# How buildings are grouped into outreach sites: buildings on touching
# parcels with the same normalized owner, within one town.

food_keyword_min_area_sqft:
  value: 20000
  status: placeholder
  note: >-
    Owner-approved screening rule, not proof of food production. A food
    keyword needs a 4xx industrial use code or at least this much site area.
    On the 2026-10-20 baseline, 8 of 14 keyword food sites fall back at
    20,000 sq ft and 9 at 50,000. JJ's Creamery falls back to generic.
    Performance Food Group, Brockton, still gets food production (code 400,
    105,770 sq ft) and is a known miss: it looks like a warehouse from the
    air and LBER says warehouse, though the company lists a meat cutting
    plant there. Only 2 of 32 sampled rows were reviewed, picked because
    they looked suspicious, so they do not estimate an error rate. Recall
    is not measured. See docs/MATCH_RATES.md, Hand review.
  test: >-
    Rerun at 50,000 sq ft and review the sites that change.
  replace: >-
    A source that confirms production, such as a list of licensed food
    manufacturers.

owner_normalization:
  # Removed after punctuation is turned into spaces.
  drop_words: [THE, INC, INCORPORATED, CORP, CORPORATION, CO, COMPANY, LLC, LTD]
  cutoff_within_chars: 1
  status: placeholder
  note: >-
    Words the pilot data shows varying within one owner, for example
    BROCKTON HOSPITAL, BROCKTON HOSPITAL INC and BROCKTON HOSPITAL COMPANY
    THE. A name within cutoff_within_chars characters of the longest owner
    name in its town is treated as possibly cut off (8 pilot towns cap
    names at 29 or 30 characters, and a cut name can lose its trailing
    space). Its last word is dropped and it may match a longer name that
    starts with it. Check false merges in the match rate report review.
  test: >-
    The owner group review in the match rate report, for false and
    missed merges.
  replace: >-
    Owner names matched to a business registry.

near_duplicate_overlap:
  value: 0.9
  status: placeholder
  note: >-
    Two footprints whose overlap is more than this share of the smaller one
    are near-duplicates: the higher building id gets near_duplicate_of. The
    flag does not change area. Exact duplicates (same shape) are dropped
    instead. Chosen by hand; the 2026-10-20 schema review found 7 such pilot
    pairs, overlapping 93 to 99 percent.
  test: >-
    Look at the flagged pairs on aerial photos.
  replace: >-
    A MassGIS rule or field marking duplicate footprints, if one exists.

touch_tolerance_m:
  value: 1.0
  status: placeholder
  note: >-
    Parcels this close count as touching, to allow for small gaps where
    parcel lines were digitized separately. Not checked against the data.
  test: >-
    The gap table in docs/MATCH_RATES.md, and the Phase 5 rerun at 1 m
    versus 5 m.
  replace: >-
    A tolerance chosen from a reviewed sample of nearly touching
    parcels.

# Matching LBER buildings to footprints. Methods run in this order and each
# LBER row stops at the first that finds a building. When a method finds
# several buildings, the largest footprint is used and the confidence reads
# "ambiguous, n buildings", so one LBER row never gives kWh to two buildings.
lber_match:
  confidence:
    ubid: high
    point_in_footprint: high
    point_in_parcel: medium
    address: low
  status: placeholder
  note: >-
    Labels for how sure a single-building match is, by method. Chosen by
    hand from the UBID check in docs/DATA.md, not measured per method.
  test: >-
    Hand check a sample of matches for each method.
  replace: >-
    Measured match accuracy for each method.

  # Address method: upper case, punctuation removed, these words shortened,
  # then exact match against parcel site addresses in the same town.
  address_words:
    STREET: ST
    AVENUE: AVE
    ROAD: RD
    DRIVE: DR
    BOULEVARD: BLVD
    LANE: LN
    COURT: CT
    PLACE: PL
    PARKWAY: PKWY
    HIGHWAY: HWY
    TERRACE: TER
    CIRCLE: CIR
    SQUARE: SQ
    NORTH: N
    SOUTH: S
    EAST: E
    WEST: W
  address_status: placeholder
  address_note: >-
    Common USPS street suffix and direction abbreviations. Not checked
    against every pilot address.
  address_test: >-
    The address method matched no pilot row; check it once it matches
    rows.
  address_replace: >-
    The full USPS street suffix list.

# Local owner: the owner's mailing state is MA (or blank) and either the
# owner city equals the parcel's town once punctuation is removed and the
# abbreviations below are spelled out, or, when both are present, the
# owner ZIP equals the parcel ZIP (catches villages such as Whitinsville
# and misspellings). P.O. boxes count like any other address.
local_owner:
  city_words: {W: WEST, N: NORTH, S: SOUTH, E: EAST}
  zip_fallback: true
  status: placeholder
  note: >-
    On pilot candidate parcels the town name alone matches 43% of owner
    cities; the ZIP fallback adds about 146, mostly abbreviations, typos
    and villages. A ZIP can cross a town line, so a few may be wrong.
  test: >-
    Hand check a sample of local and non-local owners.
  replace: >-
    The owner's address from a business registry.

# Tenure: years from the last sale to the parcels' ingest date. L3 keeps
# only the latest sale, so when it is nominal, tenure is missing; it is
# never taken from an older sale.
tenure:
  nominal_price_below: 1000
  earliest_sale_year: 1900
  status: placeholder
  note: >-
    Pilot candidate sales cluster at $0 (2,391), $1 (1,179), $10 (292),
    $99 (76) and $100 (1,648), with only 23 between $101 and $1,000, so
    any price under $1,000, or no price, counts as nominal. Sale dates
    before 1900 (as early as 1754) are treated as filler.
  test: >-
    Recount the sale price distribution after each parcel refresh.
  replace: >-
    Sale history from the registry of deeds, if older sales are needed.

# Building area checks, applied per site to the pooled assessor area (the
# sum of BLD_AREA over the site's parcels that have it) against the pooled
# footprint area on those parcels. When either check fails, those buildings
# get area_source assessor_below_footprint or assessor_above_footprint and
# use footprint times stories, or footprint alone, instead.
area_checks:
  # Below: pooled assessor area under footprint area times this.
  floor_tolerance: 0.5
  # Above: pooled assessor area over footprint area times this many times the
  # site's highest recorded stories, or times ceiling_without_stories when
  # no parcel in the site records stories.
  ceiling_stories_factor: 3
  ceiling_without_stories: 10
  status: placeholder
  note: >-
    Chosen from trigger counts on 9,284 pilot candidate sites. Floor 0.5
    flags 562 sites (0.8 would flag 1,346 and 1.0 would flag 3,975, since
    roof outlines include overhangs). Ceiling 3 x stories, or 10 without
    stories, flags 33 sites, no hospital or other healthcare site, and keeps
    all 15 sites of 9 or more stories (446 Main St, Worcester, 24 stories,
    has a ratio of 15.0). A factor of 2 would flag 230. Fallbacks, for
    flagged sites and for parcels with no BLD_AREA: footprint area times
    the parcel's stories, otherwise footprint area alone (roof outlines,
    so they include overhangs). The measured error of each fallback is in
    docs/DATA.md, Footprint area error.
  test: >-
    The area error tables in docs/DATA.md, and the Phase 5 rerun with
    estimated areas 25 percent higher and lower.
  replace: >-
    Building specific floor areas, such as property cards or LBER floor
    area.
