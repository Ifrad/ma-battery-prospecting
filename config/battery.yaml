# The standard deployment: one battery block. The model sizes sites in
# whole blocks. At 90 percent usable depth, a block holds about 470 usable
# kWh, a little under 1.9 hours at full power before conversion losses.

block:
  power_kw: 250
  energy_kwh: 522
  # Power conversion system efficiency, one way, as the page states it.
  pcs_efficiency: 0.975
  status: sourced
  source: manufacturer product page, see docs/METHOD.md
  note: >-
    Read by the owner on 2026-10-19. The page renders with JavaScript, and
    an automated recheck on 2026-10-20 could not read the figures.

per_pair:
  value: true
  status: placeholder
  note: >-
    The page lists "typical deployment: two cabinets in parallel" with
    weight and dimensions per cabinet, and does not say whether 250 kW and
    522 kWh are per cabinet or for the pair. We treat them as totals for
    the pair, so one block is two cabinets.
  test: >-
    Ask the manufacturer whether the ratings are per cabinet or per pair.
  replace: >-
    The manufacturer's stated rating for the standard deployment.

usable_depth_of_discharge:
  value: 0.90
  status: placeholder
  note: >-
    The share of rated energy the dispatch may use. The page does not state
    it; 90 percent is the plan's working value.
  test: >-
    Ask the manufacturer for the usable energy or warranted depth of
    discharge.
  replace: >-
    The manufacturer's usable energy or warranted depth of discharge.
