# ConnectedSolutions daily dispatch: summer grid program revenue for a
# battery, used in Phase 4 only where the site's utility is eligible.

eligible_utilities:
  value:
    - National Grid (Massachusetts Electric)
    - Eversource Energy (NSTAR Electric)
  status: sourced
  source: >-
    Mass Save, Offering Materials for ConnectedSolutions for C&I Customers, 6/08/2023, https://www.masssave.com/-/media/Files/PDFs/Business/CI-ConnectedSolutions-Offering-Materials_June-2023.pdf, eligibility, page 3, read 2026-10-20.
  note: >-
    Eligible: a National Grid, Eversource or Unitil electric account in
    Massachusetts that pays into the energy efficiency fund on its bill,
    with a behind-the-meter battery. Unitil serves no pilot town. Municipal
    light plant customers are not eligible.

daily_dispatch_usd_per_kw_season:
  value: 200
  status: sourced
  source: >-
    National Grid, Daily Dispatch page, https://www.nationalgridus.com/MA-Business/Energy-Saving-Programs/Daily-Dispatch ("Up to $200 per kW per summer"), and Mass Save, Offering Materials for ConnectedSolutions for C&I Customers, 6/08/2023, https://www.masssave.com/-/media/Files/PDFs/Business/CI-ConnectedSolutions-Offering-Materials_June-2023.pdf, summary table, page 3,
    both read 2026-10-20.
  note: >-
    Paid on the average kW curtailed across all events of the summer. The
    page says "up to": payment follows performance, which the performance
    factor below models. The rate is locked for 5 years for new batteries.

daily_dispatch_terms:
  events_per_summer: {min: 30, max: 60, planned: 40}
  hours_per_event: {min: 2, max: 3}
  window: {start: "15:00", end: "20:00"}
  months: [6, 7, 8, 9]
  rate_lock_years: 5
  status: sourced
  source: >-
    Mass Save, Offering Materials for ConnectedSolutions for C&I Customers, 6/08/2023, https://www.masssave.com/-/media/Files/PDFs/Business/CI-ConnectedSolutions-Offering-Materials_June-2023.pdf, summary table, page 3, and Daily Dispatch event parameters
    ("approximately 40 events per season"), read 2026-10-20; National Grid, Daily Dispatch page, https://www.nationalgridus.com/MA-Business/Energy-Saving-Programs/Daily-Dispatch, read
    2026-10-20.
  note: >-
    Events are called any day, holidays included, mostly in July and
    August. Not inputs to the value except through the performance factor
    (event length) and the overlap factor (event count).

export_cap_share_of_site_peak:
  value: 1.5
  status: sourced
  source: >-
    Mass Save, Offering Materials for ConnectedSolutions for C&I Customers, 6/08/2023, https://www.masssave.com/-/media/Files/PDFs/Business/CI-ConnectedSolutions-Offering-Materials_June-2023.pdf, Battery Storage Systems and the incentive cap (pages 4 and 6),
    read 2026-10-20.
  note: >-
    Sites that export during events have their performance incentive capped
    at 150 percent of the site's annual peak load, for batteries without an
    executed interconnection agreement as of June 8, 2023, so for every new
    block here. The model counts per block the lesser of the block's power
    and 1.5 times the estimated site peak (divided by the site's blocks),
    before the performance and overlap factors. For G-3 customers the
    program sets the peak from 15-minute peaks in the 3 to 8 p.m. event
    windows, which can be lower than the annual peak; the model uses the
    estimated annual peak for every site.

performance_factor:
  value: 0.61
  range: {low: 0.61, high: 0.92}
  status: placeholder
  note: >-
    The share of the battery's 250 kW it delivers on average across an
    event, since payment follows average kW curtailed. The range comes from
    the sourced 2 to 3 hour event length (daily_dispatch_terms): the block
    delivers about 458 kWh (469.8 usable x 0.975), which is 153 kW over a
    3-hour event (0.61) and 229 kW over a 2-hour event (0.92). The default
    assumes 3-hour events. The factor itself is derived, not read.
  test: >-
    Compare with event performance reported for enrolled batteries.
  replace: >-
    The operator's measured event performance.

overlap_factor:
  value: 0.13
  range: {low: 0, high: 0.13}
  status: placeholder
  note: >-
    The share of event days that fall on the building's own monthly peak,
    when the same battery energy cannot serve both, so grid revenue is not
    double counted with peak shaving. An upper bound: a building has at
    most one monthly peak day in each of the 4 event months, and daily
    dispatch calls at least 30 events (sourced), so at most 4 / 30 = 0.13 of event
    revenue is at risk. ConnectedSolutions revenue is reduced by this
    share.
  test: >-
    Compare event days with simulated monthly peak days on the ComStock
    sample.
  replace: >-
    A joint simulation of events and peak shaving.
