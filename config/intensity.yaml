    under_30: false
    our_area: &id001 {p10: 0.36, median: 6.54, p90: 30.77}
    lber_floor_area: {p10: 0.24, median: 6.21, p90: 22.36}
    prior_from: pilot measured, our area
    prior: *id001
  hospital:
