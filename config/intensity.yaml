    under_30: true
    our_area: {p10: 6.84, median: 20.96, p90: 30.86}
    lber_floor_area: {p10: 7.54, median: 17.95, p90: 52.39}
    prior_from: LBER statewide Healthcare, LBER floor area
    prior: {p10: 0.56, median: 9.83, p90: 31.99}
    prior_buildings: 248
  laundry:
    measured_buildings: 1
    under_30: true
    our_area: {p10: 8.33, median: 8.33, p90: 8.33}
    lber_floor_area: {p10: 8.35, median: 8.35, p90: 8.35}
    prior_from: manufacturing (proxy, likely understates)
    prior: {p10: 0.36, median: 4.35, p90: 32.65}
  manufacturing:
    measured_buildings: 169
    under_30: false
    our_area: &id002 {p10: 0.36, median: 4.35, p90: 32.65}
    lber_floor_area: {p10: 0.37, median: 4.22, p90: 23.48}
    prior_from: pilot measured, our area
    prior: *id002
  other_healthcare:
    measured_buildings: 24
