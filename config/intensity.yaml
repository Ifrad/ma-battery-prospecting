# Generated by make intensity from the database (LBER matches from make
# sites). Do not edit by hand. Yearly grid kWh per sq ft. The model uses each
# segment's prior; the funnel uses its median.
status: sourced
source: DOER Large Building Energy Reporting, reporting year 2024 (config/lber.yaml), measured
  grid electricity matched to pilot buildings in make sites; statewide LBER Healthcare rows
  for hospital and other_healthcare.
note: LBER covers buildings of about 20,000 sq ft and up, so these priors may not apply to
  smaller buildings. Nearly every segment has a low tail (p10 under 1 kWh per sq ft) that
  is implausible for an occupied commercial building and points to partial meter reporting
  in this first release; it is flagged, not floored, and it does not shrink with LBER's own
  floor area, so it is not an area error. Segments under 30 measured buildings are flagged.
segments:
  cold_storage:
    measured_buildings: 1
    under_30: true
    our_area: {p10: 15.54, median: 15.54, p90: 15.54}
    lber_floor_area: {p10: 15.54, median: 15.54, p90: 15.54}
    prior_from: manufacturing (proxy, likely understates)
    prior: {p10: 0.36, median: 4.35, p90: 32.65}
  food_production:
    measured_buildings: 2
    under_30: true
    our_area: {p10: 24.06, median: 41.59, p90: 59.13}
    lber_floor_area: {p10: 23.65, median: 39.54, p90: 55.44}
    prior_from: manufacturing (proxy, likely understates)
    prior: {p10: 0.36, median: 4.35, p90: 32.65}
  generic:
