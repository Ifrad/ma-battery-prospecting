    prior_from: LBER statewide Healthcare, LBER floor area
    prior: {p10: 0.56, median: 9.83, p90: 31.99}
    prior_buildings: 248
  warehouse:
    measured_buildings: 211
    under_30: false
    our_area: &id003 {p10: 0.33, median: 2.4, p90: 13.76}
    lber_floor_area: {p10: 0.34, median: 2.26, p90: 12.19}
    prior_from: pilot measured, our area
    prior: *id003
proxy:
  segments: [food_production, cold_storage, laundry]
  from: manufacturing
  label: proxy, likely understates
  status: placeholder
  note: Food production, cold storage and laundry have 1 or 2 measured pilot buildings and
    no LBER property type that fits. They borrow the manufacturing spread, which is wide.
    Their few measured buildings sit above its median, so it likely understates them.
  test: Compare with measured use of more such buildings.
  replace: A measured spread for each of these segments.
