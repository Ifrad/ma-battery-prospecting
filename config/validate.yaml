# Settings for make validate (docs/VALIDATION.md).

calibration_tolerance:
  value: 0.05
  status: placeholder
  note: >-
    How close the overall P10 to P90 hit rate must be to 80 percent for the
    annual energy band to count as calibrated; outside it, the band widths
    are recalibrated. Chosen by hand.
  test: >-
    Recheck the hit rate after each LBER release; a hit rate that drifts
    past this line is the signal to recalibrate.
  replace: >-
    A tolerance set from the sampling error of the hit rate at the sample
    size.

peak_shape_stress:
  all_sites: 0.7
  no_open_profile: 0.5
  status: placeholder
  note: >-
    Peak shape is unvalidated, so make validate rescores with the simulated
    monthly peak reduction share multiplied by these factors (a cut of 30
    percent for every site, 50 percent for sites with no open profile) and
    reports which sites keep their place. The owner's stress values, not a
    measured error.
  test: >-
    Replace with the error measured against real interval data, once a
    usable dataset is found.
  replace: >-
    A measured bias of the simulated peak reduction share.
