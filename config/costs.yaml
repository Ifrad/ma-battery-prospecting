# Cost of one battery block (config/battery.yaml), annualized in Phase 4 as
# installed cost over life at the financing rate, plus O&M.
#
# Not inputs: the manufacturer product page also claims "1 to 3 months off
# your bill" and recovering costs "by year two or three". Neither is used.

installed_cost_usd:
  low: 180000
  middle: 260000
  status: placeholder
  note: >-
    The owner's own estimates for one block, installed, unverified and
    pending the operator's real number. Not a model input: sites are
    ranked by value per block, and these two figures are only reference
    points beside the break-even installed cost and example costs for the
    optional model confidence. Phase 5 counts the sites whose break-even
    cost clears each.
  test: >-
    Compare with a real installed cost from the operator or from public
    bids for similar systems.
  replace: >-
    The operator's installed cost for the standard deployment.

life_years:
  value: 10
  status: sourced
  source: manufacturer product page, see docs/METHOD.md
  note: >-
    The stated warranty, read by the owner on 2026-10-19. The page's claim
    of a 15 to 20 year life is a sensitivity case, not an input.

life_sensitivity_years:
  low: 15
  high: 20
  status: sourced
  source: manufacturer product page, see docs/METHOD.md
  note: >-
    The page's claimed life, read by the owner on 2026-10-19. Used only as
    a sensitivity case, never as the default life.

financing_rate:
  value: 0.08
  status: placeholder
  note: >-
    Yearly rate used to annualize the installed cost. Not from a source.
  test: >-
    Rerun the ranking at other rates and see which sites move.
  replace: >-
    The operator's cost of capital for these projects.

om_usd_per_year:
  value: 4000
  status: placeholder
  note: >-
    Operations and maintenance for one block. An unverified estimate.
  test: >-
    Compare with the operator's service costs or a public O&M benchmark
    for small commercial batteries.
  replace: >-
    The operator's O&M cost per block.

itc:
  rate: 0.30
  default_on: false
  status: sourced
  source: >-
    26 U.S.C. 48E(a)(2)(B)(ii)(I), energy storage technology with a
    capacity under 1 MW, as amended by Pub. L. 119-21,
    https://www.law.cornell.edu/uscode/text/26/48E, read 2026-10-20; see
    docs/REVENUE_STREAMS.md.
  note: >-
    A cost-side toggle, off by default, used only in the break-even column
    and the optional model confidence; it lowers the installed cost by the
    credit. No credit if construction began after December 31, 2025 and
    includes material assistance from a prohibited foreign entity, or if
    the taxpayer is a specified foreign entity (48E(c)(3) and (d)(6)), so
    the battery's supply chain decides whether it applies. Domestic content
    and energy community adders are not modeled.

min_host_benefit_usd_per_year:
  value: null
  status: placeholder
  note: >-
    The minimum yearly benefit a host must get for the deal to be worth
    offering. Not used in scoring: it is added to the annualized cost only
    when a user asks for model confidence at a given cost and supplies a
    figure. No figure has been given, so it has no value.
  test: >-
    Ask the operator what yearly saving a host needs before it signs.
  replace: >-
    The operator's real figure.
