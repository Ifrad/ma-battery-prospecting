# Pilot regions: the towns in each chamber of commerce's service area, copied
# by hand from the chamber's own website. town_id is the MassGIS TOWN_ID,
# checked against the MassGIS Electricity Providers layer on 2026-10-19.

regions:
  metro_south:
    chamber: Metro South Chamber of Commerce
    source: https://metrosouthchamber.com/
    # The live site blocks automated requests. The list was read from the
    # Internet Archive copy of the home page ("The Metro South Region").
    source_copy: https://web.archive.org/web/20260706024938/https://metrosouthchamber.com/
    checked: 2026-10-19
    # The page also lists Dighton and Kingston, marked "water supply town".
    # They are left out as they are not part of the business service area.
    towns:
      - {name: ABINGTON, town_id: 1}
      - {name: AVON, town_id: 18}
      - {name: BRIDGEWATER, town_id: 42}
      - {name: BROCKTON, town_id: 44}
      - {name: CANTON, town_id: 50}
      - {name: EAST BRIDGEWATER, town_id: 83}
      - {name: EASTON, town_id: 88}
      - {name: HALIFAX, town_id: 118}
      - {name: HANOVER, town_id: 122}
      - {name: HANSON, town_id: 123}
      - {name: HOLBROOK, town_id: 133}
