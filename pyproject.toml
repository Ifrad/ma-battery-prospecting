[project]
name = "prospect"
version = "0.0.1"
description = "Ranks Massachusetts commercial buildings by estimated battery demand-charge savings, using public data."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
    "httpx>=0.28.1",
    "openlocationcode==1.0.1",
    "psycopg[binary]>=3.3.6",
    "pyyaml>=6.0.3",
    "tenacity>=9.2.1",
]

[project.scripts]
prospect = "prospect.cli:main"

[dependency-groups]
dev = ["pytest", "ruff"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["prospect*"]

[tool.ruff]
line-length = 88
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
