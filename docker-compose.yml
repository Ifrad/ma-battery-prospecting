services:
  db:
    image: postgis/postgis:16-3.5
    # The official image is amd64 only; Apple Silicon runs it under emulation.
    platform: linux/amd64
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-prospect}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-prospect}
      POSTGRES_DB: ${POSTGRES_DB:-prospect}
    ports:
      - "127.0.0.1:${DB_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  pgdata:
